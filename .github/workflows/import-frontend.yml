name: Importar frontend integrado
on:
  push:
    branches:
      - integracao/frontend-spring
    paths:
      - '.transfer/frontend.tar.xz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'feat: importar frontend integrado' }}
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: integracao/frontend-spring
          persist-credentials: true
      - name: Verificar e expandir pacote
        shell: bash
        run: |
          set -euo pipefail
          test -s .transfer/frontend.tar.xz.b64
          base64 --decode .transfer/frontend.tar.xz.b64 > /tmp/auto-minas-frontend.tar.xz
          echo '96d67b9965306c34f526ea50d72bc16e7dbebf08f59d32c8fce75ae7eb3af175  /tmp/auto-minas-frontend.tar.xz' | sha256sum --check
          tar --list --xz --file /tmp/auto-minas-frontend.tar.xz > /tmp/auto-minas-contents.txt
          if grep -E '(^/|(^|/)\.\.(/|$))' /tmp/auto-minas-contents.txt; then
            echo 'Caminho inseguro no pacote'; exit 1
          fi
          tar --extract --xz --file /tmp/auto-minas-frontend.tar.xz --directory .
          rm -rf .transfer
          rm -f .github/workflows/import-frontend.yml
          test -f package.json
          test -f src/lib/backend.ts
          test -f src/app/page.tsx
          git status --short
      - name: Versionar todos os arquivos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "feat: importar frontend integrado"
            git push origin HEAD:integracao/frontend-spring
          fi
