name: Frontend CI

on:
  push:
    branches:
      - main
      - integracao/frontend-spring
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar contratos
        run: npm test
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Validar ESLint
        run: npm run lint
      - name: Compilar Next.js
        run: npm run build
