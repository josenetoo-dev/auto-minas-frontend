name: Homologação Docker (sem deploy externo)

on:
  push:
    branches: [deploy/staging-stack]
  pull_request:
    branches: [integracao/frontend-spring]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: auto-minas-frontend

      - name: Checkout backend correspondente
        uses: actions/checkout@v4
        with:
          repository: josenetoo-dev/veiculos-api
          ref: deploy/staging-stack
          path: veiculos-api

      - name: Validar configuração Docker
        working-directory: auto-minas-frontend
        run: docker compose --env-file deploy/.env.staging.example -f deploy/compose.staging.yml config --quiet

      - name: Compilar imagens Java e Next.js
        working-directory: auto-minas-frontend
        run: docker compose --env-file deploy/.env.staging.example -f deploy/compose.staging.yml build api frontend

      - name: Iniciar MySQL, API e frontend no runner descartável
        working-directory: auto-minas-frontend
        run: docker compose --env-file deploy/.env.staging.example -f deploy/compose.staging.yml up -d database api frontend

      - name: Testes de fumaça integrados (sem AWS, SMTP ou dados reais)
        working-directory: auto-minas-frontend
        run: bash deploy/smoke-test.sh

      - name: Diagnóstico ao falhar
        if: failure()
        working-directory: auto-minas-frontend
        run: |
          docker compose --env-file deploy/.env.staging.example -f deploy/compose.staging.yml ps
          docker compose --env-file deploy/.env.staging.example -f deploy/compose.staging.yml logs --tail=100 api frontend database

      - name: Encerrar e descartar banco efêmero
        if: always()
        working-directory: auto-minas-frontend
        run: docker compose --env-file deploy/.env.staging.example -f deploy/compose.staging.yml down -v --remove-orphans
